<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="template/Style.css" />
  <title>Power4 Web</title>
</head>
<body>
  <h1>Power4 Web</h1>

  <div class="status">
    {{if .Win}}
      {{if eq .Win 1}}Le joueur 1 a gagné !{{else}}Le joueur 2 a gagné !{{end}}
    {{else}}
      Tour du joueur {{.CurrentPlayer}}
    {{end}}
  </div>

  <table class="board" role="grid" aria-label="Grille du Puissance 4">
    <tbody>
    {{range $r, $row := .PrintBoard}}
      <tr role="row">
      {{range $c, $cell := $row}}
        {{if eq $cell 1}}
          <td class="p1" role="gridcell" aria-label="Jeton rouge"></td>
        {{else if eq $cell 2}}
          <td class="p2" role="gridcell" aria-label="Jeton bleu"></td>
        {{else}}
          <td class="empty" role="gridcell" aria-label="Case vide"></td>
        {{end}}
      {{end}}
      </tr>
    {{end}}
    </tbody>
  </table>

  <form class="cols" action="/play" method="post">
    <button name="col" value="0" {{if .Win}}disabled{{end}}>Col 1</button>
    <button name="col" value="1" {{if .Winner}}disabled{{end}}>Col 2</button>
    <button name="col" value="2" {{if .Winner}}disabled{{end}}>Col 3</button>
    <button name="col" value="3" {{if .Winner}}disabled{{end}}>Col 4</button>
    <button name="col" value="4" {{if .Win}}disabled{{end}}>Col 5</button>
    <button name="col" value="5" {{if .Win}}disabled{{end}}>Col 6</button>
    <button name="col" value="6" {{if .Win}}disabled{{end}}>Col 7</button>
    <button name="col" value="reset" type="submit" aria-label="Réinitialiser la partie">↺ Réinitialiser</button>
  </form>

</body>
</html>
