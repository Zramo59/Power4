<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puissance 4</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Puissance 4</h1>
        <div class="grid">
            {{range $i, $row := .Power.Table}}
                {{range $j, $cell := $row}}
                    <div class="cell {{if eq $cell "X"}}x{{else if eq $cell "O"}}o{{end}}">
                        {{$cell}}
                    </div>
                {{end}}
            {{end}}
        </div>
        <div class="info">
            <p>Joueur actuel: {{.Power.CurrentPlayer}}</p>
        </div>
        <div class="Game">
            {{if .Power.Winner}}
                <div class="info">
                    <h2>Le joueur {{.Power.Winner}} a gagné !</h2>
                </div>
            {{else if .Power.IsDraw}}
                <div class="info">
                    <h2>Match nul !</h2>
                </div>
            {{end}}
        </div>
        <form class="cols" action="/play" method="post">
            {{range $i := .Cols}}
            <button name="col" value="{{$i}}" id="col-{{$i}}" type="submit" aria-label="Jouer dans la colonne {{$i}}">colonne {{$i}}</button>
            {{end}}
        </form>
        <form action="/reset" method="post" class="reset-form">
            <button type="submit" aria-label="Réinitialiser le jeu">Réinitialiser le jeu</button>
        </form>
    </div>
</body>
</html>
